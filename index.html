/* Helper utility additions */
.feed-column { display: flex; flex-direction: column; gap: 16px; }
.dot.violet { background: #635ee0; }
.announcement-list { display: flex; flex-direction: column; gap: 14px; }
.comment-section { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.comment-item { display: flex; gap: 10px; font-size: 11px; align-items: flex-start; }
.comment-bubble { background: var(--soft); padding: 8px 12px; border-radius: 10px; flex: 1; }
.comment-bubble b { display: block; font-size: 11px; color: var(--ink); margin-bottom: 2px; }
.comment-bubble p { margin: 0; font-size: 11px; color: #475467; }
.comment-bubble small { font-size: 9px; color: var(--muted); display: block; margin-top: 3px; }
.comment-input-row { display: flex; gap: 8px; margin-top: 8px; }
.comment-input-row input { flex: 1; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); font-size: 11px; font-family: inherit; }
.comment-input-row button { padding: 6px 14px; font-size: 11px; font-weight: 600; background: var(--brand); color: white; border-radius: 8px; border: none; cursor: pointer; }
.demo-badge-row { display: flex; gap: 8px; margin: 12px 0 6px; flex-wrap: wrap; }
.demo-pill { font-size: 10px; font-weight: 600; padding: 5px 10px; border-radius: 6px; border: 1px dashed var(--brand); background: #f0efff; color: var(--brand); cursor: pointer; transition: all .15s ease; }
.demo-pill:hover { background: var(--brand); color: white; }
.toast-notice { position: fixed; bottom: 24px; right: 24px; background: #17202e; color: white; padding: 10px 18px; border-radius: 9px; font-size: 12px; font-weight: 500; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 99999; animation: successPop .3s ease both; display: flex; align-items: center; gap: 8px; }

/* Kudos Feature Styles */
.post-kudos-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 6px; }
.kudos-chip { display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(135deg, #fff7e6, #fff0cf); border: 1px solid #fed888; color: #a16409; font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 500; box-shadow: 0 2px 6px rgba(200, 140, 20, 0.1); animation: successPop 0.35s cubic-bezier(0.2, 1.5, 0.35, 1) both; }
.kudos-chip svg { color: #d97706; }
.kudos-chip b { color: #78350f; font-weight: 600; }
.post-actions button.kudos-btn { color: #b45309; }
.post-actions button.kudos-btn:hover { background: #fef3c7; color: #92400e; border-color: #fde68a; }
.post-actions button.kudos-btn.active-kudos { background: #fef3c7; color: #92400e; font-weight: 600; border-color: #f59e0b; }
.kudos-modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
.kudos-option-card { background: white; border: 1.5px solid var(--line); border-radius: 12px; padding: 14px; text-align: left; cursor: pointer; transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1); display: flex; align-items: flex-start; gap: 12px; }
.kudos-option-card:hover, .kudos-option-card.selected { border-color: #f59e0b; background: #fffdf5; transform: translateY(-2px); box-shadow: 0 6px 18px rgba(245, 158, 11, 0.15); }
.kudos-option-icon { width: 38px; height: 38px; border-radius: 10px; background: #fef3c7; color: #d97706; display: grid; place-items: center; flex: none; font-size: 18px; }
.kudos-option-card div b { display: block; font-size: 12px; color: var(--ink); margin-bottom: 2px; }
.kudos-option-card div p { margin: 0; font-size: 10px; color: var(--muted); line-height: 1.35; }

/* Status and Action Buttons */
.status.pending { color: #d97706; font-weight: 600; }
.status.pending i { background: #f59e0b; }
.status.rejected { color: #dc2626; font-weight: 600; }
.status.rejected i { background: #ef4444; }
.action-pill { height: 26px; border-radius: 6px; padding: 0 9px; display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; border: 1px solid transparent; cursor: pointer; transition: all .16s ease; }
.approve-pill { background: #ddf3e9; color: #1e7e59; border-color: #b4e7d0; }
.approve-pill:hover { background: #c6eedb; transform: translateY(-1px); }
